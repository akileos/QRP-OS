name: Build HAM Radio NixOS Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Enable better Nix build parallelism
      NIX_CONFIG: |
        max-jobs = auto
        cores = 0
        # Use GitHub Actions cache more aggressively  
        build-users-group = nixbld
        auto-optimise-store = true
    strategy:
      matrix:
        #edition: [swl, digimodes, cw, full]
        #arch: [x86, rpi3, rpi4, rpi5, rpi400, rpizero2w]  
        edition: [digimodes]
        arch: [x86, rpi3]  
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU for aarch64 builds
      if: matrix.arch != 'x86'
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          extra-platforms = aarch64-linux x86_64-linux
          max-jobs = auto
          always-allow-substitutes = true
          # Optimize for CI performance
          builders-use-substitutes = true
          substituters = https://cache.nixos.org/ https://nix-community.cachix.org
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    
    # Use GitHub Actions cache for Nix store (free alternative to paid caches)
    - name: Cache Nix store
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/nix
          /nix/store
        key: nix-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('flake.lock') }}
        restore-keys: |
          nix-${{ runner.os }}-${{ matrix.arch }}-
          nix-${{ runner.os }}-

    - name: Determine image properties and target system
      id: image_props
      run: |
        TARGET_SYSTEM=""
        if [ "${{ matrix.arch }}" == "x86" ]; then
          echo "format=iso" >> $GITHUB_OUTPUT
          echo "extension=iso" >> $GITHUB_OUTPUT
          echo "path_glob=result/iso/*.iso" >> $GITHUB_OUTPUT
          TARGET_SYSTEM="x86_64-linux"
        elif [[ "${{ matrix.arch }}" == "rpi3" || \
                  "${{ matrix.arch }}" == "rpi4" || \
                  "${{ matrix.arch }}" == "rpi5" || \
                  "${{ matrix.arch }}" == "rpi400" || \
                  "${{ matrix.arch }}" == "rpizero2w" ]]; then
          echo "format=sd-aarch64" >> $GITHUB_OUTPUT
          echo "extension=img" >> $GITHUB_OUTPUT
          echo "path_glob=result/sd-image/*.img" >> $GITHUB_OUTPUT
          TARGET_SYSTEM="aarch64-linux"
        else
          # This case should not be hit with the current matrix
          echo "format=raw" >> $GITHUB_OUTPUT 
          echo "extension=img" >> $GITHUB_OUTPUT
          echo "path_glob=result/disk.img" >> $GITHUB_OUTPUT
          TARGET_SYSTEM="x86_64-linux" # Fallback
        fi
        echo "target_system=$TARGET_SYSTEM" >> $GITHUB_OUTPUT
        
    - name: Build ${{ matrix.edition }}-${{ matrix.arch }} (${{ steps.image_props.outputs.format }}) for ${{ steps.image_props.outputs.target_system }}
      run: |
        # Show what we're building for transparency
        echo "Building package: .#packages.${{ steps.image_props.outputs.target_system }}.${{ matrix.edition }}-${{ matrix.arch }}-${{ steps.image_props.outputs.format }}"
        
        # Validate package exists before building
        echo "Checking if package exists..."
        nix eval .#packages.${{ steps.image_props.outputs.target_system }}.${{ matrix.edition }}-${{ matrix.arch }}-${{ steps.image_props.outputs.format }} --json --accept-flake-config > /dev/null
        
        # Use --no-link to avoid creating result symlinks that might cause issues
        # Use --print-out-paths to see what was built
        echo "Starting build with verbose output..."
        nix build \
          --no-link \
          --print-out-paths \
          --verbose \
          --option sandbox false \
          --accept-flake-config \
          .#packages.${{ steps.image_props.outputs.target_system }}.${{ matrix.edition }}-${{ matrix.arch }}-${{ steps.image_props.outputs.format }} || {
            echo "Build failed, checking logs..."
            nix log --accept-flake-config .#packages.${{ steps.image_props.outputs.target_system }}.${{ matrix.edition }}-${{ matrix.arch }}-${{ steps.image_props.outputs.format }} || echo "No logs available"
            exit 1
          }
        
        # Create result symlink for upload step
        echo "Creating result symlink..."
        nix build --accept-flake-config .#packages.${{ steps.image_props.outputs.target_system }}.${{ matrix.edition }}-${{ matrix.arch }}-${{ steps.image_props.outputs.format }}
        
    - name: Upload Image
      uses: actions/upload-artifact@v4
      with:
        name: qrp-os-${{ matrix.edition }}-${{ matrix.arch }}.${{ steps.image_props.outputs.extension }}
        path: ${{ steps.image_props.outputs.path_glob }}