name: Build HAM Radio NixOS Images

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        edition: [swl, digimodes, cw, full]
        arch: [x86, rpi3, rpi4, rpi5]  
    
    steps:
    - uses: actions/checkout@v3
    
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    
    - name: Build ${{ matrix.edition }}-${{ matrix.arch }} ISO
      run: |
        nix build .#${{ matrix.edition }}-${{ matrix.arch }}-iso
        
    - name: Upload ISO
      uses: actions/upload-artifact@v3
      with:
        name: ham-radio-${{ matrix.edition }}-${{ matrix.arch }}.iso
        path: result/iso/*.iso